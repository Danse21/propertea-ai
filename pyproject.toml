[project]
name = "propertea-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ivan Kolokoltsev", email = "ikolokoltsev@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.5",
    "sqlalchemy>=2.0.52",
    "scikit-learn>=1.9.0",
    "joblib>=1.6.0",
    "requests>=2.34.2",
    "pandas>=3.0.5",
    "numpy>=2.5.3",
    "python-dotenv>=1.2.3",
    "bcrypt>=5.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["backend"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "seaborn>=0.13.2",
    "streamlit>=1.63.0",
    "watchdog>=6.0.0",
]
